spring.application.name=exchange

# ── DataSource (matches docker-compose.yml) ──────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/exchange
spring.datasource.username=exchange_user
spring.datasource.password=exchange_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────
# validate: Hibernate checks the schema matches entities but does NOT modify it
# Flyway owns all schema changes — Hibernate must not interfere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ───────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Actuator ─────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Swagger / OpenAPI ────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ── Logging ──────────────────────────────────────────────────────────
logging.level.com.project.exchange=DEBUG
logging.level.org.flywaydb=INFO
