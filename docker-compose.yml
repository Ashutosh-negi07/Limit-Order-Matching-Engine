services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange_postgres
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange_user
      POSTGRES_PASSWORD: exchange_pass
    ports:
      - "5432:5432"
    volumes:
      - exchange_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange_user -d exchange"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  exchange_postgres_data:
